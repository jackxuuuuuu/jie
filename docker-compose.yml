version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: jie-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jie_db
      MYSQL_USER: jie
      MYSQL_PASSWORD: jie123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujie", "-pjie123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jie-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: jie_db
      DB_USER: jie
      DB_PASS: jie123
      JWT_SECRET: jie-secret-key-must-be-at-least-32-chars-long!
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data:
