server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jie_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:jie}
    password: ${DB_PASS:jie123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # NOTE: 'always' re-runs schema/data SQL on every startup.
      # Use 'never' or Flyway/Liquibase migrations for production.
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      separator: ";"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jie.module
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:jie-secret-key-must-be-at-least-32-chars-long!}
  expiration-ms: 86400000   # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  info:
    title: Jie Leave Management API
    version: 1.0.0

logging:
  level:
    com.jie: DEBUG
    org.springframework.security: INFO
